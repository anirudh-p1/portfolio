<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anirudh P | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
   <style>
    /* 1. Dark Grey Background (Applied to app, body, content, and sidebar) */
    body, #app, .content, section.content, .sidebar {
      background-color: #1a1a1a !important; 
    }
    
    /* 2. Custom Table Styles */
    kbd, table, td, th {
      border: 1px solid #30363d !important;
      background-color: #262626 !important; /* Slightly lighter grey for tables */
    }
    th {
      background-color: #333333 !important;
    }
    
    /* 3. Link Colours */
    a {
      color: #58a6ff !important; 
    }

    /* 4. Regular Text: Smooth Light Grey */
    .markdown-section, 
    .markdown-section p, 
    .markdown-section li {
      color: #dcdcdc !important;
    }

    /* 5. Headings (# titles), Bold (**), and Italics (*): Pure White */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6,
    .markdown-section strong, 
    .markdown-section em {
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="app">...</div>
  <script>
    window.$docsify = {
      name: 'Anirudh P | Portfolio',
      homepage: 'README.md', 
      themeColor: '#58a6ff', 
      relativePath: true,
      basePath: './',
      /* This turns on the sidebar functionality */
      loadSidebar: true
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
