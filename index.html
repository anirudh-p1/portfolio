<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anirudh P | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    /* ===== 1. Dark Grey Background ===== */
    body, #app, .content, section.content, .sidebar {
      background-color: #1a1a1a !important;
    }

    /* ===== 2. Custom Table Styles ===== */
    kbd, table, td, th {
      border: 1px solid #30363d !important;
      background-color: #262626 !important;
    }
    th { background-color: #333333 !important; }

    /* ===== 3. Link Colours ===== */
    a { color: #58a6ff !important; }

    /* ===== 4. Regular Text: Light Grey ===== */
    .markdown-section,
    .markdown-section p,
    .markdown-section li {
      color: #dcdcdc !important;
      padding-bottom: 70px; /* room for the fixed footer bar */
    }

    /* ===== 5. Headings / Bold / Italic: White ===== */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6,
    .markdown-section strong,
    .markdown-section em {
      color: #ffffff !important;
    }

    /* ===== Fixed footer (LinkedIn / Email / GitHub) ===== */
    .portfolio-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 10px 20px;
      text-align: center;
      z-index: 50;
    }
    .portfolio-footer a {
      color: #58a6ff !important;
      text-decoration: underline;
      font-weight: 500;
      margin: 0 15px;
    }

    /* ===== Link cards (home page buttons / program list) ===== */
    .link-card-row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .link-card {
      flex: 1;
      min-width: 140px;
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      color: #58a6ff !important;
      font-weight: bold;
      text-decoration: none;
      display: block;
    }
    .link-card:hover { border-color: #58a6ff; }

    /* ===== Program page header (title + logo top-right) ===== */
    .program-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .program-header h1 { margin: 0; }
    .program-logo-link img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 6px;
    }

    /* ===== Project carousel ===== */
    .pc-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 30px 0 15px;
    }
    .pc-arrow {
      background: #161b22;
      border: 1px solid #30363d;
      color: #58a6ff;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .pc-arrow:hover { border-color: #58a6ff; }
    .pc-card {
      width: 320px;
      max-width: 65vw;
      height: 200px;
      background-color: #161b22;
      background-size: cover;
      background-position: center;
      border: 1px solid #30363d;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: flex-end;
      transition: border-color 0.15s;
    }
    .pc-card:hover { border-color: #58a6ff; }
    .pc-card .pc-card-label {
      width: 100%;
      padding: 12px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      color: #ffffff !important;
      font-weight: bold;
    }
    .pc-card .pc-card-label small {
      display: block;
      font-weight: normal;
      color: #dcdcdc;
      margin-top: 4px;
    }
    .pc-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .pc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30363d;
      cursor: pointer;
    }
    .pc-dot.active { background: #58a6ff; }
    .show-all-btn {
      display: inline-block;
      margin-top: 10px;
      color: #58a6ff !important;
      text-decoration: underline;
      font-weight: 600;
    }

    /* ===== All-projects grid ===== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .projects-grid a {
      display: block;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      color: #58a6ff !important;
      text-decoration: none;
      font-weight: bold;
    }
    .projects-grid a:hover { border-color: #58a6ff; }
    .projects-grid a p {
      color: #dcdcdc !important;
      font-weight: normal;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* ===== Project detail page ===== */
    .project-detail-wrap {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .project-detail-text { flex: 2; min-width: 250px; }
    .project-detail-images { flex: 1; min-width: 200px; }
    .project-detail-images img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #30363d;
      margin-bottom: 12px;
    }
    .project-links a {
      display: inline-block;
      margin: 4px 8px 4px 0;
      padding: 8px 14px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #58a6ff !important;
      text-decoration: none;
      font-weight: bold;
    }
    .project-links a:hover { border-color: #58a6ff; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'Anirudh P | Portfolio',
      homepage: 'README.md',
      themeColor: '#58a6ff',
      relativePath: true,
      basePath: './',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    };

    // ============================================================
    // CHANGE ME: this is the single place to add / edit / remove
    // project cards shown in the "My Projects" carousel and on the
    // "All Projects" show-all page.
    //   - image: leave "" for a plain dark card, or paste an image URL
    //   - path:  folder path (no leading slash) to that project's README
    // ============================================================
    window.PORTFOLIO_PROJECTS = [
      { title: "Anti-MABL", blurb: "ML-powered resistance control for microgravity bone-loss training machines.", image: "", path: "My Projects/Anti-MABL/README" },
      { title: "FreshSight-AI", blurb: "CNN monitoring perishable produce freshness in real time at retail.", image: "", path: "My Projects/FreshSight-AI/README" },
      { title: "Mock Modular Attention", blurb: "Ramanujan Q-series & mock theta kernels for symmetry-constrained sequential learning.", image: "", path: "My Projects/Mock_Modular_Attention/README" },
      { title: "Non-Trivial Fellowship Project", blurb: "Alternative attention kernels to reduce superposition in transformers.", image: "", path: "My Projects/Non-Trivial-Project/README" },
      { title: "Writings", blurb: "Essays, pre-prints and articles on varied topics.", image: "", path: "My Projects/Writings/README" },
      { title: "PiNNs for Metabolic Thresholds", blurb: "Physics-informed neural networks predicting metabolic thresholds.", image: "", path: "My Projects/PiNNs_for_Metabolic_Thresholds/README" },
      { title: "Gartner Hype Cycle Model", blurb: "A mathematical model of the Gartner Hype Cycle with NumPy/Matplotlib.", image: "", path: "My Projects/Gartner_Hype_Cycle_Matplotlib/README" }
    ];

    (function () {
      var pcIndex = 0;

      function renderCarousel() {
        var mount = document.getElementById('project-carousel');
        if (!mount) return;
        var projects = window.PORTFOLIO_PROJECTS || [];
        if (!projects.length) { mount.innerHTML = '<p>No projects yet — add some in index.html.</p>'; return; }
        if (pcIndex >= projects.length) pcIndex = 0;
        if (pcIndex < 0) pcIndex = projects.length - 1;
        var p = projects[pcIndex];
        var bg = p.image ? 'background-image:url(' + p.image + ');' : '';

        var dots = projects.map(function (_, i) {
          return '<span class="pc-dot' + (i === pcIndex ? ' active' : '') + '" data-i="' + i + '"></span>';
        }).join('');

        mount.innerHTML =
          '<div class="pc-wrap">' +
            '<button class="pc-arrow" id="pc-prev" aria-label="Previous project">&#8249;</button>' +
            '<div class="pc-card" id="pc-card" style="' + bg + '">' +
              '<div class="pc-card-label">' + p.title + '<small>' + p.blurb + '</small></div>' +
            '</div>' +
            '<button class="pc-arrow" id="pc-next" aria-label="Next project">&#8250;</button>' +
          '</div>' +
          '<div class="pc-dots">' + dots + '</div>' +
          '<div style="text-align:center;"><a class="show-all-btn" href="#/My%20Projects/All%20Projects/README">Show All Projects &rarr;</a></div>';

        document.getElementById('pc-prev').onclick = function () { pcIndex--; renderCarousel(); };
        document.getElementById('pc-next').onclick = function () { pcIndex++; renderCarousel(); };
        document.getElementById('pc-card').onclick = function () {
          location.hash = '#/' + encodeURI(p.path);
        };
        Array.prototype.forEach.call(mount.querySelectorAll('.pc-dot'), function (dot) {
          dot.onclick = function () { pcIndex = parseInt(dot.getAttribute('data-i'), 10); renderCarousel(); };
        });
      }

      function renderAllGrid() {
        var mount = document.getElementById('all-projects-grid');
        if (!mount) return;
        var projects = window.PORTFOLIO_PROJECTS || [];
        mount.innerHTML = projects.map(function (p) {
          return '<a href="#/' + encodeURI(p.path) + '">' + p.title + '<p>' + p.blurb + '</p></a>';
        }).join('');
      }

      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
          renderCarousel();
          renderAllGrid();

          if (!document.querySelector('.portfolio-footer')) {
            var footer = document.createElement('div');
            footer.className = 'portfolio-footer';
            footer.innerHTML =
              '<a href="https://www.linkedin.com/in/anirudh-p-6570883a9" target="_blank">LinkedIn</a>' +
              '<a href="mailto:anirudhprabhu6@gmail.com">Email</a>' +
              '<a href="https://github.com/anirudh-p1" target="_blank">GitHub</a>';
            document.body.appendChild(footer);
          }
        });
      });
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
